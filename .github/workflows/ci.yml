name: EventoAI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventoai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, build, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # CI-only placeholders; never use production credentials here.
      NEXT_PUBLIC_SUPABASE_URL: https://eventoai-ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      GEMINI_API_KEY: CI_NOT_A_REAL_GEMINI_KEY

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload browser-test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: eventoai-playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7